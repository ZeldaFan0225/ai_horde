# Publishes to npm when a GitHub Release is published. The release tag's version is used for the package.
# Authenticates via npm Trusted Publishing (OIDC), no token secret needed. The package's trusted publisher
# on npmjs.com must be set to: ZeldaFan0225 / ai_horde / publish.yml
# The version is only *staged*: a maintainer has to approve it with 2FA on npmjs.com (Staged Packages tab)
# or via `npm stage approve <stage-id>` before it goes live.

name: Publish to npm on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v6.1.0). Run this from main so the current workflow is used.'
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout the release tag to build the exact sources being released
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Staged publishing needs Node >= 22.14.0
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm >= 11.15.0, Node 22 ships with an older npm
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Derive version from release tag
        id: ver
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          RAW_TAG="${TAG_NAME}"
          VERSION="${RAW_TAG#v}"
          echo "Using version: $VERSION (from tag: $RAW_TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag (no new tag)
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version

      - name: Build
        run: npm run build --if-present

      - name: Stage publish to npm
        run: |
          # Submits the version for approval; it is not installable until a maintainer approves it with 2FA.
          npm stage publish --provenance --access public

      - name: Checkout default branch for commit
        if: ${{ success() }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo-main
          fetch-depth: 0

      - name: Commit version bump back to default branch
        if: ${{ success() }}
        working-directory: repo-main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Updating package.json and lockfile on $(git rev-parse --abbrev-ref HEAD) to version $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git add package.json package-lock.json || true
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): v$VERSION"
            git push
          fi
